<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F2ED">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AutoServis">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>AutoServis</title>
  <script>
    /* Apply saved/system theme before CSS paints to avoid a flash of the wrong theme. */
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem('autoservis_data') || '{}');
        var s = (d.settings && d.settings.theme) || 'auto';
        var dark = s === 'dark' || (s === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css?v=2.0.0">
  <link rel="stylesheet" href="/fonts.css?v=2.0.0">
  <script src="/app.js?v=2.0.0" defer></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title" data-i18n="appName">AutoServis</h1>
  </header>

  <main class="app-main">

    <!-- ============ VIEW: HOME ============ -->
    <section class="view view--active" id="view-home">
      <div class="chip-row" id="home-chips"></div>
      <div class="card" id="home-vehicle"></div>
      <div class="card card--status" id="home-next"></div>
      <div class="card" id="home-last-fuel"></div>
      <div class="quick-actions">
        <button class="btn btn--primary" id="btn-quick-fuel" data-i18n="addFuel">Dodaj gorivo</button>
        <button class="btn btn--primary" id="btn-quick-service" data-i18n="addService">Dodaj servis</button>
      </div>
    </section>

    <!-- ============ VIEW: FUEL ============ -->
    <section class="view" id="view-fuel">
      <div class="stat" id="fuel-avg"></div>
      <div class="view-header">
        <button class="btn btn--primary btn--icon" id="btn-add-fuel" aria-label="Add fuel">+</button>
      </div>
      <div class="table-wrap">
        <table class="table" id="fuel-table">
          <thead>
            <tr>
              <th data-i18n="date">Datum</th>
              <th data-i18n="kmTh">km</th>
              <th data-i18n="liters">Litara</th>
              <th data-i18n="total">Ukupno</th>
              <th data-i18n="consShort">l/100</th>
            </tr>
          </thead>
          <tbody id="fuel-rows"></tbody>
        </table>
      </div>
      <div class="empty" id="fuel-empty" data-i18n="noFuel">Nema unosa goriva</div>
    </section>

    <!-- ============ VIEW: SERVICES ============ -->
    <section class="view" id="view-services">
      <div class="view-header">
        <button class="btn btn--primary btn--icon" id="btn-add-service" aria-label="Add service">+</button>
      </div>
      <div class="table-wrap">
        <table class="table table--services" id="services-table">
          <thead>
            <tr>
              <th data-i18n="type">Tip</th>
              <th data-i18n="date">Datum</th>
              <th data-i18n="kmTh">km</th>
              <th data-i18n="work">Napravljeno</th>
              <th data-i18n="cost">Trošak</th>
            </tr>
          </thead>
          <tbody id="services-rows"></tbody>
        </table>
      </div>
      <div class="empty" id="services-empty" data-i18n="noServices">Nema unosa servisa</div>
    </section>

    <!-- ============ VIEW: SETTINGS ============ -->
    <section class="view" id="view-settings">
      <div class="settings-group">
        <h2 class="settings-group__title" data-i18n="vehicles">Vozila</h2>
        <div id="settings-vehicles"></div>
        <div class="settings-row">
          <button class="btn btn--primary btn--block" id="btn-add-vehicle" data-i18n="addVehicle">Dodaj vozilo</button>
        </div>
      </div>
      <div class="settings-group">
        <h2 class="settings-group__title" data-i18n="language">Jezik</h2>
        <div class="settings-row settings-row--seg2">
          <button class="btn" id="set-lang-hr">Hrvatski</button>
          <button class="btn" id="set-lang-en">English</button>
        </div>
      </div>
      <div class="settings-group">
        <h2 class="settings-group__title" data-i18n="theme">Izgled</h2>
        <div class="settings-row settings-row--seg3">
          <button class="btn" id="set-theme-auto" data-i18n="themeAuto">Auto</button>
          <button class="btn" id="set-theme-light" data-i18n="themeLight">Svijetla</button>
          <button class="btn" id="set-theme-dark" data-i18n="themeDark">Tamna</button>
        </div>
      </div>
      <div class="settings-group">
        <h2 class="settings-group__title" data-i18n="data">Podaci</h2>
        <div class="settings-row">
          <button class="btn btn--secondary btn--block" id="btn-export" data-i18n="exportData">Izvezi podatke</button>
        </div>
        <div class="settings-row">
          <label class="btn btn--secondary btn--block file-label">
            <span data-i18n="importData">Uvezi podatke</span>
            <input class="file-input" type="file" id="btn-import" accept="application/json">
          </label>
        </div>
        <div class="settings-row">
          <button class="btn btn--danger btn--block" id="btn-reset" data-i18n="resetData">Obriši sve podatke</button>
        </div>
      </div>
      <div class="settings-version" id="set-version">v2.0.0</div>
    </section>

  </main>

  <!-- ============ TAB BAR ============ -->
  <nav class="tab-bar">
    <button class="tab tab--active" id="tab-home" data-i18n="tabHome">Početna</button>
    <button class="tab" id="tab-fuel" data-i18n="tabFuel">Gorivo</button>
    <button class="tab" id="tab-services" data-i18n="tabServices">Servisi</button>
    <button class="tab" id="tab-settings" data-i18n="tabSettings">Postavke</button>
  </nav>

  <!-- ============ OVERLAY: FUEL ============ -->
  <div class="overlay" id="overlay-fuel" hidden>
    <div class="overlay__panel">
      <div class="overlay__header">
        <h2 class="overlay__title" id="fuel-title"></h2>
        <button class="overlay__close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="overlay__body">
        <label class="field">
          <span class="field__label" data-i18n="date">Datum</span>
          <input type="date" id="fl-date">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="mileage">Kilometraža</span>
          <input type="number" id="fl-km" inputmode="numeric" min="0" step="1">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="liters">Litara</span>
          <input type="number" id="fl-liters" inputmode="decimal" min="0" step="0.01">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="pricePerLiter">Cijena po litri</span>
          <input type="number" id="fl-price" inputmode="decimal" min="0" step="0.01">
        </label>
        <div class="field-total">
          <span class="field__label" data-i18n="total">Ukupno</span>
          <span class="field-total__value" id="fl-total">0,00 €</span>
        </div>
        <label class="field field--check">
          <input type="checkbox" id="fl-full">
          <span class="field__label" data-i18n="fullTank">Pun spremnik</span>
        </label>
      </div>
      <div class="overlay__footer">
        <button class="btn btn--danger" id="fl-delete" data-i18n="delete">Obriši</button>
        <button class="btn" id="fl-cancel" data-i18n="cancel">Odustani</button>
        <button class="btn btn--primary" id="fl-save" data-i18n="save">Spremi</button>
      </div>
    </div>
  </div>

  <!-- ============ OVERLAY: SERVICE ============ -->
  <div class="overlay" id="overlay-service" hidden>
    <div class="overlay__panel">
      <div class="overlay__header">
        <h2 class="overlay__title" id="service-title"></h2>
        <button class="overlay__close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="overlay__body">
        <label class="field">
          <span class="field__label" data-i18n="type">Tip</span>
          <select id="sv-type">
            <option value="oil" data-i18n="serviceTypes.oil">Ulje i filter ulja</option>
            <option value="air-filter" data-i18n="serviceTypes.airFilter">Filter zraka</option>
            <option value="fuel-filter" data-i18n="serviceTypes.fuelFilter">Filter goriva</option>
            <option value="timing-belt" data-i18n="serviceTypes.timingBelt">Razvodni remen</option>
            <option value="other" data-i18n="serviceTypes.other">Ostalo</option>
          </select>
        </label>
        <label class="field">
          <span class="field__label" data-i18n="date">Datum</span>
          <input type="date" id="sv-date">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="mileage">Kilometraža</span>
          <input type="number" id="sv-km" inputmode="numeric" min="0" step="1">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="work">Što napravljeno</span>
          <textarea id="sv-work" rows="2"></textarea>
        </label>
        <label class="field">
          <span class="field__label" data-i18n="parts">Zamijenjeni dijelovi</span>
          <input type="text" id="sv-parts">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="notes">Bilješke</span>
          <textarea id="sv-notes" rows="2"></textarea>
        </label>
        <label class="field">
          <span class="field__label" data-i18n="cost">Trošak</span>
          <input type="number" id="sv-cost" inputmode="decimal" min="0" step="0.01">
        </label>
      </div>
      <div class="overlay__footer">
        <button class="btn btn--danger" id="sv-delete" data-i18n="delete">Obriši</button>
        <button class="btn" id="sv-cancel" data-i18n="cancel">Odustani</button>
        <button class="btn btn--primary" id="sv-save" data-i18n="save">Spremi</button>
      </div>
    </div>
  </div>

  <!-- ============ OVERLAY: VEHICLE ============ -->
  <div class="overlay" id="overlay-vehicle" hidden>
    <div class="overlay__panel">
      <div class="overlay__header">
        <h2 class="overlay__title" id="vehicle-title"></h2>
        <button class="overlay__close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="overlay__body">
        <label class="field">
          <span class="field__label" data-i18n="name">Naziv</span>
          <input type="text" id="vh-name">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="make">Marka</span>
          <input type="text" id="vh-make">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="model">Model</span>
          <input type="text" id="vh-model">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="year">Godina</span>
          <input type="number" id="vh-year" inputmode="numeric" min="1900" max="2100" step="1">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="plate">Registracija</span>
          <input type="text" id="vh-plate">
        </label>
        <label class="field">
          <span class="field__label" data-i18n="mileage">Kilometraža</span>
          <input type="number" id="vh-mileage" inputmode="numeric" min="0" step="1">
        </label>
      </div>
      <div class="overlay__footer">
        <button class="btn btn--danger" id="vh-delete" data-i18n="delete">Obriši</button>
        <button class="btn" id="vh-set-active" data-i18n="setActive">Postavi aktivnim</button>
        <button class="btn" id="vh-cancel" data-i18n="cancel">Odustani</button>
        <button class="btn btn--primary" id="vh-save" data-i18n="save">Spremi</button>
      </div>
    </div>
  </div>

  <!-- ============ GLOBAL: TOAST ============ -->
  <div class="toast" id="toast" hidden></div>

  <!-- ============ GLOBAL: CONFIRM DIALOG ============ -->
  <div class="confirm" id="confirm" hidden>
    <div class="confirm__panel" role="dialog" aria-modal="true">
      <div class="confirm__title" id="confirm-title"></div>
      <div class="confirm__text" id="confirm-text"></div>
      <div class="confirm__actions">
        <button class="btn" id="confirm-cancel" data-i18n="cancel">Odustani</button>
        <button class="btn btn--danger" id="confirm-ok" data-i18n="delete">Obriši</button>
      </div>
    </div>
  </div>

  <!-- ============ GLOBAL: UPDATE BANNER ============ -->
  <div class="update-banner" id="update-banner" hidden>
    <span class="update-banner__text" data-i18n="newVersion">Nova verzija dostupna</span>
    <button class="update-banner__reload" id="update-reload" data-i18n="reload">Učitaj ponovo</button>
  </div>

</body>
</html>
